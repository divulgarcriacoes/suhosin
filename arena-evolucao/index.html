<title>Arena Evolução</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho com unidade + abas; painel central; no celular as abas rolam na horizontal */
:root{
  --bg:#F2F5F0; --surface:#FFFFFF; --ink:#10243A; --muted:#5B6B7A; --line:#DCE3DB;
  --green:#1B7F4B; --green-soft:#DDF0E4; --gold:#B87900; --gold-soft:#FBEBC4;
  --red:#C0322A; --red-soft:#F9DAD6; --head:#10243A; --head-ink:#F2F5F0; --head-accent:#F0B429;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif; --f-body:'Barlow',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1822; --surface:#13242F; --ink:#E7EEF2; --muted:#93A5B3; --line:#243846;
  --green:#46C47F; --green-soft:#16392B; --gold:#F0B429; --gold-soft:#3B3010;
  --red:#F2706A; --red-soft:#40201F; --head:#091219; --head-ink:#E7EEF2; --head-accent:#F0B429; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1822; --surface:#13242F; --ink:#E7EEF2; --muted:#93A5B3; --line:#243846;
  --green:#46C47F; --green-soft:#16392B; --gold:#F0B429; --gold-soft:#3B3010;
  --red:#F2706A; --red-soft:#40201F; --head:#091219; --head-ink:#E7EEF2; --head-accent:#F0B429; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
header{background:var(--head);color:var(--head-ink);padding-block:14px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.badge{width:40px;height:44px;background:var(--head-accent);color:#10243A;display:grid;place-items:center;font:800 22px var(--f-display);clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);padding-bottom:6px}
.brand b{font:800 24px var(--f-display);letter-spacing:.06em;text-transform:uppercase;display:block;line-height:1}
.brand small{opacity:.7;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.unit{display:flex;align-items:center;gap:8px}
.unit label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.7}
.unit select{background:#ffffff1a;border:1px solid #ffffff40;border-radius:6px;padding:7px 10px;color:var(--head-ink)}
.unit select option{color:#10243A}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:0;color:var(--head-ink);opacity:.7;padding:10px 14px;cursor:pointer;font:700 16px var(--f-display);letter-spacing:.06em;text-transform:uppercase;border-bottom:3px solid transparent;white-space:nowrap}
nav button:hover{opacity:1}
nav button[aria-selected="true"]{opacity:1;border-color:var(--head-accent)}
:focus-visible{outline:2px solid var(--head-accent);outline-offset:2px}
main{padding-block:20px 60px;display:grid;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{font-size:22px;margin-bottom:10px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpi span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi b{display:block;font:800 40px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:13px;color:var(--muted)}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:130px 1fr 64px;gap:10px;align-items:center;font-size:14px}
.bar i{display:block;height:14px;border-radius:3px;background:var(--green)}
.bar .track{background:var(--green-soft);border-radius:3px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.scroll{overflow-x:auto}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.wait{background:var(--gold-soft);color:var(--gold)}
.pill.late{background:var(--red-soft);color:var(--red)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:#07140d}
.btn.sm{padding:4px 9px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.muted{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on.P{background:var(--green);color:#fff}
.seg button.on.F{background:var(--red);color:#fff}
.seg button.on.J{background:var(--gold);color:#fff}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field input,.field select,.field textarea,.filters select,.filters input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters select,.filters input{width:auto;min-width:150px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px}
.chip:hover{border-color:var(--green)}
.check{display:flex;gap:8px;align-items:center}
.phone{width:min(100%,290px);margin-inline:auto;background:#0b1118;border-radius:30px;padding:12px;border:3px solid #26343f}
.screen{background:linear-gradient(#27475f,#142a3a);border-radius:20px;padding:14px 10px;min-height:340px;display:grid;gap:10px;align-content:start;color:#fff}
.screen .time{text-align:center;font:700 38px var(--f-display);margin-top:6px}
.screen .date{text-align:center;font-size:12px;opacity:.8;margin-bottom:8px}
.push{background:#ffffffee;color:#10243A;border-radius:14px;padding:10px 12px;font-size:13px}
.push small{display:flex;gap:6px;align-items:center;opacity:.7;font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.08em}
.push small i{width:14px;height:14px;background:#F0B429;border-radius:4px;display:inline-block}
.push b{display:block;font-size:14px;margin-top:2px}
.sms{background:#2b3a46;border-radius:14px 14px 14px 4px;padding:9px 12px;font-size:13px;max-width:92%}
.sms small{display:block;opacity:.6;font-size:10px;margin-bottom:2px}
.ev{display:flex;gap:12px;padding-block:10px;border-bottom:1px solid var(--line);align-items:center}
.ev:last-child{border:0}
.date-box{width:52px;text-align:center;background:var(--green-soft);color:var(--green);border-radius:8px;padding:4px 0;flex:none}
.date-box b{display:block;font:800 22px/1 var(--f-display)}
.date-box span{font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.ideas{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.idea h3{font-size:19px}
.idea p{margin:4px 0 0;color:var(--muted);font-size:14px}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--gold)}
.pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green)}
.ex{font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--head);color:var(--head-ink);padding:10px 16px;border-radius:8px;z-index:9;max-width:92vw;box-shadow:0 6px 24px #0005}
@media (max-width:560px){.bar{grid-template-columns:90px 1fr 56px}.kpi b{font-size:34px}}
@media (prefers-reduced-motion:no-preference){.pbar i,.bar i{transition:width .4s}}
.fcwrap{display:grid;place-items:center;padding:8px}
.fc{width:min(100%,330px);aspect-ratio:330/490;position:relative;filter:drop-shadow(0 14px 22px #0008);font-family:var(--f-display);color:#fff;container-type:inline-size}
.fc .sh{position:absolute;inset:0;clip-path:polygon(50% 0,86% 4.5%,100% 11%,100% 84%,50% 100%,0 84%,0 11%,14% 4.5%);background:linear-gradient(160deg,#FF7A2E,#E8480F 55%,#FF8F3F)}
.fc .sh2{position:absolute;inset:2.4cqw;clip-path:polygon(50% 0,86% 4.5%,100% 11%,100% 84%,50% 100%,0 84%,0 11%,14% 4.5%);background:radial-gradient(circle at 50% 78%,#ffffff22 0 14cqw,transparent 14.4cqw),linear-gradient(115deg,transparent 40%,#ffffff1c 48%,transparent 56%),linear-gradient(170deg,#6A22B0 0%,#431073 48%,#2A0A4C 100%)}
.fc .ph{position:absolute;left:22%;right:2%;top:7%;height:54%;object-fit:cover;object-position:50% 10%;-webkit-mask-image:radial-gradient(ellipse 50% 58% at 50% 48%,#000 40%,transparent 100%);mask-image:radial-gradient(ellipse 50% 58% at 50% 48%,#000 40%,transparent 100%)}
.fc .sil{position:absolute;left:30%;right:8%;top:14%;height:46%;opacity:.35}
.fc .ovr{position:absolute;left:11%;top:12%;text-align:center;line-height:.9}
.fc .ovr b{display:block;font-weight:800;font-size:19cqw;text-shadow:0 2px 0 #0004}
.fc .ovr span{font-weight:700;font-size:7.5cqw;letter-spacing:.08em;color:#FFB27A}
.fc .lg{position:absolute;left:10.5%;top:42%;width:17cqw}
.fc .un{position:absolute;left:8%;top:62%;font-size:3.6cqw;font-weight:600;letter-spacing:.06em}
.fc .nm{position:absolute;left:8%;right:8%;top:64.5%;text-align:center;line-height:1;text-transform:uppercase;border-bottom:.5cqw solid #F25A1B;padding-bottom:2cqw}
.fc .nm small{display:block;font-size:4.4cqw;font-weight:600;letter-spacing:.14em;color:#FFC9A3}
.fc .nm b{font-weight:800;font-size:10.5cqw;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.fc .st{position:absolute;left:15%;right:15%;top:77.5%;display:grid;grid-template-columns:1fr 1fr;gap:1cqw 8cqw}
.fc .st div{display:flex;justify-content:center;gap:3cqw;align-items:baseline;font-size:8cqw;line-height:1.1}
.fc .st b{font-weight:800;color:#fff}
.fc .st span{font-weight:600;color:#FFB27A;letter-spacing:.04em}
.fc .tier{position:absolute;top:5.5%;left:50%;transform:translateX(-50%);font-size:3.4cqw;font-weight:700;letter-spacing:.2em;color:#FFC9A3;white-space:nowrap}
.sl{display:grid;grid-template-columns:44px 1fr 32px;gap:10px;align-items:center;margin-bottom:6px}
.sl input{width:100%;accent-color:var(--green);padding:0;background:none;border:0}
.sl output{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.rk{cursor:pointer}.rk:hover td{background:var(--bg)}
</style>

<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><div class="badge">AE</div><div><b>Arena Evolução</b><small>Escola de futebol · protótipo</small></div></div>
      <div class="unit"><label for="unitSel">Unidade</label><select id="unitSel"></select></div>
    </div>
    <nav id="tabs" role="tablist"></nav>
  </div>
</header>
<main class="wrap" id="view"></main>
<div id="toast" hidden></div>

<script>
const UNITS=[{id:'u1',name:'Centro'},{id:'u2',name:'Jardim América'},{id:'u3',name:'Vila Nova'},{id:'u4',name:'Parque das Águias'}];
const CATS=['Sub-7','Sub-9','Sub-11','Sub-13','Sub-15'];
const DIAS=['Seg e Qua','Ter e Qui','Sáb'];
const HORA=['17h30','18h30','09h00','16h00'];
const COACH=['Prof. Rafael','Prof. Diego','Profa. Camila','Prof. Marcelo','Prof. Bruno','Profa. Letícia'];
const FIRST=['Miguel','Arthur','Heitor','Theo','Davi','Gael','Enzo','Lucas','Pedro','Nicolas','Bernardo','Samuel','Joaquim','Lorenzo','Rafael','Gustavo','Felipe','Caio','Vinícius','Murilo','João','Bento','Henrique','Davi Lucca'];
const RESP=['Ana','Carlos','Fernanda','Ricardo','Juliana','Marcos','Patrícia','Eduardo','Camila','Roberto','Simone','André'];
const LAST=['Silva','Souza','Oliveira','Santos','Lima','Pereira','Costa','Rodrigues','Almeida','Nascimento','Ferreira','Barbosa','Ribeiro','Martins','Carvalho'];
function rnd(i){const x=Math.sin(i*9301+49297)*233280;return x-Math.floor(x)}
const TURMAS=[],ALUNOS=[];
UNITS.forEach((u,ui)=>{for(let k=0;k<3;k++){const id='t'+(TURMAS.length+1);TURMAS.push({id,unit:u.id,name:CATS[(ui+k*2)%5],dias:DIAS[k%3],hora:HORA[(ui+k)%4],coach:COACH[(ui*2+k)%6]})}});
TURMAS.forEach((t,ti)=>{for(let k=0;k<8;k++){const n=ti*8+k,last=LAST[(ti*5+k*3)%LAST.length];const r=rnd(n+3);
  ALUNOS.push({id:'a'+n,turma:t.id,unit:t.unit,name:FIRST[(ti*7+k*5)%FIRST.length]+' '+last,resp:RESP[(n*7)%RESP.length]+' '+last,
  tel:'(11) 9'+String(1000+Math.floor(rnd(n+9)*8999))+'-'+String(1000+Math.floor(rnd(n+21)*8999)),
  pres:Math.round(62+rnd(n+5)*38),valor:k===3?169:189,
  pay:r<.6?'ok':r<.82?'wait':'late',venc:r<.82?'10/10':'10/09'})}});
const hoje='Qui 08/10/2026';
const ATT={};TURMAS.forEach(t=>{ATT[t.id]={};ALUNOS.filter(a=>a.turma===t.id).forEach((a,i)=>{const r=rnd(a.id.length*31+i+t.id.length*7);ATT[t.id][a.id]=r<.72?'P':r<.84?'F':r<.9?'J':null})});
let NOTICES=[
 {when:'ontem, 18:02',title:'Amistoso sábado',body:'Amistoso contra a Escola Craque Nato, sábado às 9h. Chegar 8h20 com uniforme completo.',who:'Sub-11 · Todas as unidades',n:64,push:true,sms:false},
 {when:'05/10, 08:15',title:'Treino cancelado por chuva',body:'Hoje não haverá treino na unidade Vila Nova. Reposição no sábado.',who:'Vila Nova',n:24,push:true,sms:true},
 {when:'01/10, 10:00',title:'Mensalidade de outubro',body:'Sua mensalidade vence dia 10. Pague pelo Pix no app e evite atraso.',who:'Todas as unidades',n:96,push:true,sms:true}];
const EVENTOS=[{d:'10',m:'out',t:'Amistoso Sub-11 x Escola Craque Nato',s:'Centro · 09h00'},{d:'17',m:'out',t:'Festival de Peneiras Sub-13',s:'Jardim América · 08h00'},{d:'24',m:'out',t:'Entrega de uniformes novos',s:'Todas as unidades · 17h30'},{d:'31',m:'out',t:'Mini copa Arena Evolução',s:'Parque das Águias · 08h30'}];
const IDEIAS=[
 ['Cobrança','Pix com QR code na tela da mensalidade','O responsável paga em 2 toques. A baixa é automática, sem conferir comprovante.'],
 ['Cobrança','Lembretes automáticos de vencimento','Aviso 3 dias antes, no dia e 2 dias depois. SMS só se o push não for aberto.'],
 ['Cobrança','Desconto irmão e plano anual','Regra de valor por aluno, com contrato e recibo digital.'],
 ['Presença','Chamada pelo celular do professor','Funciona sem internet na quadra e sincroniza depois.'],
 ['Presença','Aviso de falta para os pais','Aluno marcado como falta gera um push perguntando o motivo.'],
 ['Presença','Alerta de risco de evasão','Aluno com 3 faltas seguidas aparece em destaque para a coordenação.'],
 ['Pais','Evolução do aluno','Ficha com avaliação técnica por trimestre, fotos e vídeos curtos de treino.'],
 ['Pais','Confirmação de presença em jogos','Responsável responde Vai ou Não vai e o professor vê a lista de convocados.'],
 ['Pais','Autorização de imagem e atestado','Documentos assinados no app, com validade e aviso de vencimento.'],
 ['Gestão','Transferência entre unidades','O aluno troca de unidade e leva histórico, mensalidade e turma.'],
 ['Gestão','Estoque de uniformes e bolas','Tamanho por aluno, pedido de uniforme e controle por unidade.'],
 ['Gestão','Painel do dono','Receita, inadimplência, lotação e evasão de todas as unidades numa tela.']];
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const $=s=>document.querySelector(s);
const state={tab:'painel',unit:'all',turma:null,pay:'all',q:'',nu:'all',nt:'all',ntitle:'Amistoso no sábado',nbody:'Amistoso contra a Escola Craque Nato, sábado às 9h. Chegar 8h20 com uniforme completo.',npush:true,nsms:true};
const TABS=[['painel','Painel'],['presenca','Presença'],['mensal','Mensalidades'],['avisos','Avisos'],['alunos','Alunos'],['pais','App dos pais'],['ideias','Ideias']];
const uname=id=>UNITS.find(u=>u.id===id).name;
const inUnit=a=>state.unit==='all'||a.unit===state.unit;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2800)}
function pill(p){return p==='ok'?'<span class="pill ok">Pago</span>':p==='wait'?'<span class="pill wait">A vencer</span>':'<span class="pill late">Atrasado</span>'}

function vPainel(){
  const al=ALUNOS.filter(inUnit),pagos=al.filter(a=>a.pay==='ok'),atr=al.filter(a=>a.pay==='late');
  const rec=pagos.reduce((s,a)=>s+a.valor,0),tot=al.reduce((s,a)=>s+a.valor,0),pm=Math.round(al.reduce((s,a)=>s+a.pres,0)/al.length);
  const per=UNITS.filter(u=>state.unit==='all'||u.id===state.unit).map(u=>{const x=ALUNOS.filter(a=>a.unit===u.id);return{n:u.name,pres:Math.round(x.reduce((s,a)=>s+a.pres,0)/x.length),rec:x.filter(a=>a.pay==='ok').reduce((s,a)=>s+a.valor,0),tot:x.reduce((s,a)=>s+a.valor,0),alunos:x.length}});
  const risk=al.filter(a=>a.pres<70).slice(0,5);
  return `<div class="grid kpis">
   <div class="card kpi"><span>Alunos ativos</span><b>${al.length}</b><em>${new Set(al.map(a=>a.turma)).size} turmas</em></div>
   <div class="card kpi"><span>Presença média</span><b>${pm}%</b><em>últimos 30 dias</em></div>
   <div class="card kpi"><span>Recebido em outubro</span><b>${brl(rec)}</b><em>de ${brl(tot)} previstos</em></div>
   <div class="card kpi"><span>Em atraso</span><b>${atr.length}</b><em>${brl(atr.reduce((s,a)=>s+a.valor,0))} a receber</em></div></div>
  <div class="grid two">
   <div class="card"><h2>Presença por unidade</h2><div class="bars">${per.map(p=>`<div class="bar"><span>${p.n}</span><div class="track"><i style="width:${p.pres}%"></i></div><span class="v">${p.pres}%</span></div>`).join('')}</div></div>
   <div class="card"><h2>Recebimento por unidade</h2><div class="bars">${per.map(p=>`<div class="bar"><span>${p.n}</span><div class="track"><i style="width:${Math.round(p.rec/p.tot*100)}%;background:var(--gold)"></i></div><span class="v">${Math.round(p.rec/p.tot*100)}%</span></div>`).join('')}</div></div></div>
  <div class="grid two">
   <div class="card"><h2>Atenção da coordenação</h2><p class="muted" style="margin:0 0 6px">Alunos com presença abaixo de 70%.</p>
    <div class="scroll"><table><tbody>${risk.map(a=>`<tr><td>${a.name}</td><td class="muted">${TURMAS.find(t=>t.id===a.turma).name} · ${uname(a.unit)}</td><td><span class="pill late">${a.pres}%</span></td></tr>`).join('')||'<tr><td class="muted">Nenhum aluno em risco.</td></tr>'}</tbody></table></div></div>
   <div class="card"><h2>Próximos eventos</h2>${EVENTOS.map(e=>`<div class="ev"><div class="date-box"><b>${e.d}</b><span>${e.m}</span></div><div><b>${e.t}</b><div class="muted">${e.s}</div></div></div>`).join('')}</div></div>
  <p class="ex">Dados fictícios para demonstração.</p>`;
}

function vPresenca(){
  const ts=TURMAS.filter(t=>state.unit==='all'||t.unit===state.unit);
  if(!ts.find(t=>t.id===state.turma))state.turma=ts[0].id;
  const t=TURMAS.find(x=>x.id===state.turma),al=ALUNOS.filter(a=>a.turma===t.id),m=ATT[t.id];
  const c={P:0,F:0,J:0};al.forEach(a=>{if(m[a.id])c[m[a.id]]++});
  return `<div class="card"><div class="row sp"><div class="filters"><select id="turmaSel" aria-label="Turma">${ts.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${uname(x.unit)} · ${x.name} · ${x.dias} ${x.hora}</option>`).join('')}</select></div>
   <div class="muted">${hoje} · ${t.coach}</div></div></div>
  <div class="card"><div class="row sp" style="margin-bottom:8px"><h2 style="margin:0">Chamada</h2><div class="row"><span class="pill ok">${c.P} presentes</span><span class="pill late">${c.F} faltas</span><span class="pill wait">${c.J} justificadas</span></div></div>
   <div class="scroll"><table><thead><tr><th>Aluno</th><th>Marcar</th><th>Presença no mês</th></tr></thead><tbody>
   ${al.map(a=>`<tr><td><b>${a.name}</b></td><td><div class="seg" data-a="${a.id}">${[['P','Presente'],['F','Faltou'],['J','Justif.']].map(([k,l])=>`<button class="${m[a.id]===k?'on '+k:''}" data-att="${k}">${l}</button>`).join('')}</div></td><td style="min-width:130px"><div class="pbar"><i style="width:${a.pres}%"></i></div><span class="muted">${a.pres}%</span></td></tr>`).join('')}</tbody></table></div>
   <div class="row" style="margin-top:14px"><button class="btn primary" id="saveAtt">Salvar chamada</button><button class="btn" id="allP">Marcar todos presentes</button><button class="btn" id="notifyF">Avisar pais dos faltosos</button></div></div>`;
}

function vMensal(){
  const al=ALUNOS.filter(inUnit).filter(a=>(state.pay==='all'||a.pay===state.pay)&&(!state.q||(a.name+a.resp).toLowerCase().includes(state.q.toLowerCase())));
  const sum=k=>ALUNOS.filter(inUnit).filter(a=>a.pay===k).reduce((s,a)=>s+a.valor,0);
  return `<div class="grid kpis"><div class="card kpi"><span>Recebido</span><b style="color:var(--green)">${brl(sum('ok'))}</b></div><div class="card kpi"><span>A vencer</span><b style="color:var(--gold)">${brl(sum('wait'))}</b></div><div class="card kpi"><span>Atrasado</span><b style="color:var(--red)">${brl(sum('late'))}</b></div></div>
  <div class="card"><div class="filters" style="margin-bottom:12px"><input id="q" placeholder="Buscar aluno ou responsável" value="${state.q}"><select id="payF" aria-label="Situação">${[['all','Todas as situações'],['ok','Pagos'],['wait','A vencer'],['late','Atrasados']].map(([v,l])=>`<option value="${v}" ${state.pay===v?'selected':''}>${l}</option>`).join('')}</select></div>
  <div class="scroll"><table><thead><tr><th>Aluno</th><th>Responsável</th><th>Unidade</th><th>Venc.</th><th>Valor</th><th>Situação</th><th></th></tr></thead><tbody>
  ${al.slice(0,24).map(a=>`<tr><td><b>${a.name}</b></td><td>${a.resp}<div class="muted">${a.tel}</div></td><td>${uname(a.unit)}</td><td>${a.venc}</td><td>${brl(a.valor)}</td><td>${pill(a.pay)}</td>
  <td style="white-space:nowrap">${a.pay==='ok'?'<button class="btn sm" data-recibo="'+a.id+'">Recibo</button>':'<button class="btn sm primary" data-baixa="'+a.id+'">Dar baixa</button> <button class="btn sm" data-cobrar="'+a.id+'">Cobrar</button>'}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">Nenhum resultado.</td></tr>'}</tbody></table></div>
  <p class="ex">Mostrando até 24 de ${al.length}. Pagamento por Pix com baixa automática é uma das ideias da última aba.</p></div>`;
}

function recipients(){return ALUNOS.filter(a=>(state.nu==='all'||a.unit===state.nu)&&(state.nt==='all'||TURMAS.find(t=>t.id===a.turma).name===state.nt)).length}
function vAvisos(){
  const n=recipients();
  const tpl=[['Amistoso no sábado','Amistoso contra a Escola Craque Nato, sábado às 9h. Chegar 8h20 com uniforme completo.'],['Treino cancelado','Hoje não haverá treino por causa da chuva. Reposição no sábado, no mesmo horário.'],['Lembrete de mensalidade','Sua mensalidade vence dia 10. Pague pelo Pix no app e evite atraso.'],['Uniforme novo','Chegaram os uniformes novos. Retire na sua unidade a partir de segunda.'],['Reunião de pais','Reunião com a coordenação na quinta, às 19h, na unidade Centro.']];
  return `<div class="grid two" style="align-items:start">
  <div class="card"><h2>Novo aviso aos pais</h2>
   <div class="chips">${tpl.map((t,i)=>`<button class="chip" data-tpl="${i}">${t[0]}</button>`).join('')}</div>
   <div class="row" style="align-items:start"><div class="field" style="flex:1;min-width:140px"><label for="nu">Unidade</label><select id="nu"><option value="all">Todas</option>${UNITS.map(u=>`<option value="${u.id}" ${state.nu===u.id?'selected':''}>${u.name}</option>`).join('')}</select></div>
   <div class="field" style="flex:1;min-width:140px"><label for="nt">Categoria</label><select id="nt"><option value="all">Todas</option>${CATS.map(c=>`<option ${state.nt===c?'selected':''}>${c}</option>`).join('')}</select></div></div>
   <div class="field"><label for="ntitle">Título</label><input id="ntitle" maxlength="50" value="${state.ntitle}"></div>
   <div class="field"><label for="nbody">Mensagem <span id="cnt" class="muted"></span></label><textarea id="nbody" rows="4" maxlength="160">${state.nbody}</textarea></div>
   <div class="row" style="margin-bottom:14px"><label class="check"><input type="checkbox" id="npush" ${state.npush?'checked':''}>Push no app</label><label class="check"><input type="checkbox" id="nsms" ${state.nsms?'checked':''}>SMS</label></div>
   <div class="row sp"><span class="muted" id="dest"></span><button class="btn primary" id="send">Enviar aviso</button></div></div>
  <div class="card"><h2>Como os pais recebem</h2><div class="phone"><div class="screen"><div class="time">18:42</div><div class="date">quinta-feira, 8 de outubro</div>
   <div class="push" id="pvPush"></div><div class="sms" id="pvSms"></div></div></div></div></div>
  <div class="card"><h2>Histórico de envios</h2><div class="scroll"><table><thead><tr><th>Quando</th><th>Aviso</th><th>Para</th><th>Canais</th><th>Famílias</th></tr></thead><tbody>
  ${NOTICES.map(x=>`<tr><td class="muted" style="white-space:nowrap">${x.when}</td><td><b>${x.title}</b><div class="muted">${x.body}</div></td><td>${x.who}</td><td>${[x.push&&'Push',x.sms&&'SMS'].filter(Boolean).join(' + ')}</td><td>${x.n}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function updPreview(){
  const p=$('#pvPush'),s=$('#pvSms');if(!p)return;
  p.hidden=!state.npush;s.hidden=!state.nsms;
  p.innerHTML=`<small><i></i>Arena Evolução · agora</small><b></b><span></span>`;p.querySelector('b').textContent=state.ntitle||'Título do aviso';p.querySelector('span').textContent=state.nbody||'Mensagem';
  s.innerHTML=`<small>SMS · ARENAEVOL</small><span></span>`;s.querySelector('span').textContent='Arena Evolução: '+(state.ntitle?state.ntitle+'. ':'')+state.nbody;
  $('#cnt').textContent='('+state.nbody.length+'/160)';
  const n=recipients();$('#dest').textContent=n+' famílias'+(state.nsms?' · SMS estimado '+brl(n*0.09):'');
}

function vAlunos(){
  const al=ALUNOS.filter(inUnit).filter(a=>!state.q||(a.name+a.resp).toLowerCase().includes(state.q.toLowerCase()));
  return `<div class="card"><div class="filters" style="margin-bottom:12px"><input id="q" placeholder="Buscar aluno ou responsável" value="${state.q}"></div>
  <div class="scroll"><table><thead><tr><th>Aluno</th><th>Turma</th><th>Unidade</th><th>Responsável</th><th>Presença</th><th>Mensalidade</th></tr></thead><tbody>
  ${al.slice(0,30).map(a=>{const t=TURMAS.find(x=>x.id===a.turma);return `<tr><td><b>${a.name}</b></td><td>${t.name}<div class="muted">${t.dias} ${t.hora}</div></td><td>${uname(a.unit)}</td><td>${a.resp}<div class="muted">${a.tel}</div></td><td><span class="pill ${a.pres>=85?'ok':a.pres>=70?'wait':'late'}">${a.pres}%</span></td><td>${pill(a.pay)}</td></tr>`}).join('')}</tbody></table></div>
  <p class="ex">Mostrando até 30 de ${al.length}. Dados fictícios.</p></div>`;
}

function vPais(){
  const a=ALUNOS[2],t=TURMAS.find(x=>x.id===a.turma);
  return `<div class="grid two" style="align-items:start"><div class="card"><h2>Visão do responsável</h2>
   <div class="phone"><div class="screen" style="background:var(--surface);color:var(--ink);gap:12px">
    <div class="row sp"><b style="font:800 18px var(--f-display);letter-spacing:.05em">ARENA EVOLUÇÃO</b><span class="pill ok">${uname(a.unit)}</span></div>
    <div><div class="muted" style="font-size:12px">Aluno</div><b style="font:700 22px var(--f-display)">${a.name}</b><div class="muted">${t.name} · ${t.dias} ${t.hora}</div></div>
    <div style="background:var(--bg);border-radius:10px;padding:10px"><div class="muted" style="font-size:12px">Presença no mês</div><b style="font:800 28px var(--f-display)">${a.pres}%</b><div class="pbar"><i style="width:${a.pres}%"></i></div></div>
    <div style="background:var(--gold-soft);color:var(--gold);border-radius:10px;padding:10px"><b>Mensalidade de outubro</b><div>${brl(a.valor)} · vence 10/10</div><button class="btn sm primary" style="margin-top:6px" data-toast="Aqui abriria o Pix copia e cola">Pagar com Pix</button></div>
    <div style="background:var(--bg);border-radius:10px;padding:10px"><b>Sábado 10/10, 9h</b><div class="muted">Amistoso contra Craque Nato</div><div class="row" style="margin-top:6px"><button class="btn sm" data-toast="Presença confirmada">Vai</button><button class="btn sm" data-toast="Ausência registrada">Não vai</button></div></div>
   </div></div></div>
   <div class="card"><h2>O que o responsável faz no app</h2><ul style="padding-left:18px;display:grid;gap:8px;margin:0"><li>Recebe os avisos da escola por push, com SMS como reserva.</li><li>Vê a presença do filho e justifica uma falta.</li><li>Paga a mensalidade por Pix e baixa o recibo.</li><li>Confirma presença em jogos e eventos.</li><li>Acompanha a avaliação técnica de cada trimestre.</li><li>Tem vários filhos na mesma conta, mesmo em unidades diferentes.</li></ul></div></div>`;
}

function vIdeias(){
  return `<div class="card"><h2>Ideias para as próximas versões</h2><p class="muted" style="margin:0">Diga quais valem a pena e eu monto a segunda versão do protótipo.</p></div>
  <div class="grid ideas">${IDEIAS.map(i=>`<div class="card idea"><div class="tag">${i[0]}</div><h3>${i[1]}</h3><p>${i[2]}</p></div>`).join('')}</div>`;
}

const VIEWS={painel:vPainel,presenca:vPresenca,mensal:vMensal,avisos:vAvisos,alunos:vAlunos,pais:vPais,ideias:vIdeias};
function render(){
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button role="tab" aria-selected="${state.tab===k}" data-tab="${k}">${l}</button>`).join('');
  $('#view').innerHTML=VIEWS[state.tab]();
  if(state.tab==='avisos')updPreview();
}
$('#unitSel').innerHTML='<option value="all">Todas as unidades</option>'+UNITS.map(u=>`<option value="${u.id}">${u.name}</option>`).join('');
$('#unitSel').onchange=e=>{state.unit=e.target.value;render()};

document.addEventListener('click',e=>{
  const g=s=>e.target.closest(s);let b;
  if(b=g('[data-tab]')){state.tab=b.dataset.tab;state.q='';render();window.scrollTo(0,0)}
  else if(b=g('[data-att]')){const a=b.parentElement.dataset.a;ATT[state.turma][a]=b.dataset.att;render()}
  else if(g('#allP')){Object.keys(ATT[state.turma]).forEach(k=>ATT[state.turma][k]='P');render();toast('Todos marcados como presentes')}
  else if(g('#saveAtt')){toast('Chamada salva. Os pais podem ver a presença no app.')}
  else if(g('#notifyF')){const n=Object.values(ATT[state.turma]).filter(v=>v==='F').length;toast(n+' famílias avisadas por push (simulado)')}
  else if(b=g('[data-baixa]')){const a=ALUNOS.find(x=>x.id===b.dataset.baixa);a.pay='ok';render();toast('Baixa registrada: '+a.name)}
  else if(b=g('[data-cobrar]')){const a=ALUNOS.find(x=>x.id===b.dataset.cobrar);toast('Lembrete enviado a '+a.resp+' por push e SMS (simulado)')}
  else if(b=g('[data-recibo]')){toast('Recibo gerado (simulado)')}
  else if(b=g('[data-toast]')){toast(b.dataset.toast)}
  else if(b=g('[data-tpl]')){const t=[['Amistoso no sábado','Amistoso contra a Escola Craque Nato, sábado às 9h. Chegar 8h20 com uniforme completo.'],['Treino cancelado','Hoje não haverá treino por causa da chuva. Reposição no sábado, no mesmo horário.'],['Lembrete de mensalidade','Sua mensalidade vence dia 10. Pague pelo Pix no app e evite atraso.'],['Uniforme novo','Chegaram os uniformes novos. Retire na sua unidade a partir de segunda.'],['Reunião de pais','Reunião com a coordenação na quinta, às 19h, na unidade Centro.']][b.dataset.tpl];
    state.ntitle=t[0];state.nbody=t[1];$('#ntitle').value=t[0];$('#nbody').value=t[1];updPreview()}
  else if(g('#send')){
    if(!state.npush&&!state.nsms){toast('Escolha ao menos um canal');return}
    const n=recipients(),who=(state.nu==='all'?'Todas as unidades':uname(state.nu))+(state.nt==='all'?'':' · '+state.nt);
    NOTICES.unshift({when:'agora',title:state.ntitle,body:state.nbody,who,n,push:state.npush,sms:state.nsms});
    render();toast('Aviso enviado a '+n+' famílias (simulado)')}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='ntitle'){state.ntitle=e.target.value;updPreview()}
  else if(id==='nbody'){state.nbody=e.target.value;updPreview()}
  else if(id==='q'){state.q=e.target.value;const p=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='turmaSel'){state.turma=e.target.value;render()}
  else if(id==='payF'){state.pay=e.target.value;render()}
  else if(id==='nu'){state.nu=e.target.value;updPreview()}
  else if(id==='nt'){state.nt=e.target.value;updPreview()}
  else if(id==='npush'){state.npush=e.target.checked;updPreview()}
  else if(id==='nsms'){state.nsms=e.target.checked;updPreview()}

const SK=['RIT','CHU','PAS','DRI','DEF','FIS'];
const WT={ATA:[.25,.3,.1,.2,0,.15],MEI:[.15,.1,.3,.25,.1,.1],ZAG:[.1,0,.1,.05,.4,.35],LAT:[.25,.05,.2,.15,.2,.15]};
const CARD={},PH={};PH[ALUNOS[0].id]=PHOTO;state.card=ALUNOS[0].id;
function cardOf(a){if(!CARD[a.id]){const n=+a.id.slice(1);CARD[a.id]={pos:['ATA','MEI','ZAG','LAT'][n%4],st:SK.map((_,k)=>n===0?[78,72,66,80,48,63][k]:Math.round(42+rnd(n*7+k)*46))}}return CARD[a.id]}
function ovrOf(c){const w=WT[c.pos];return Math.round(c.st.reduce((s,v,i)=>s+v*w[i],0))}
function tierOf(o){return o>=75?'CRAQUE DA ARENA':o>=62?'DESTAQUE':'EM EVOLUÇÃO'}
function cardHTML(a){const c=cardOf(a),o=ovrOf(c),p=a.name.split(' '),img=PH[a.id];
 return `<div class="fc"><div class="sh"></div><div class="sh2"></div><div class="tier">${tierOf(o)}</div>
 ${img?`<img class="ph" src="${img}" alt="Foto de ${a.name}">`:`<svg class="sil" viewBox="0 0 100 120" aria-hidden="true"><circle cx="50" cy="38" r="22" fill="#fff"/><path d="M8 120c0-34 18-50 42-50s42 16 42 50z" fill="#fff"/></svg>`}
 <div class="ovr"><b>${o}</b><span>${c.pos}</span></div><img class="lg" src="${LOGO}" alt="Arena Evolução">
 <div class="un">${uname(a.unit).toUpperCase()}</div>
 <div class="nm"><small>${p[0]}</small><b>${p.slice(1).join(' ')}</b></div>
 <div class="st">${c.st.map((v,i)=>`<div><b>${v}</b><span>${SK[i]}</span></div>`).join('')}</div></div>`}
function vCarta(){
 const al=ALUNOS.filter(inUnit);if(!al.find(a=>a.id===state.card))state.card=al[0].id;
 const a=ALUNOS.find(x=>x.id===state.card),c=cardOf(a),t=TURMAS.find(x=>x.id===a.turma);
 const top=[...al].sort((x,y)=>ovrOf(cardOf(y))-ovrOf(cardOf(x))).slice(0,8);
 return `<div class="grid two" style="align-items:start">
 <div class="card"><h2>Avaliação do aluno</h2>
  <div class="field"><label for="cardSel">Aluno</label><select id="cardSel">${al.map(x=>`<option value="${x.id}" ${x.id===a.id?'selected':''}>${x.name} · ${TURMAS.find(y=>y.id===x.turma).name} · ${uname(x.unit)}</option>`).join('')}</select></div>
  <div class="field"><label for="cardPos">Posição</label><select id="cardPos">${['ATA','MEI','ZAG','LAT'].map(p=>`<option ${c.pos===p?'selected':''}>${p}</option>`).join('')}</select></div>
  ${SK.map((k,i)=>`<div class="sl"><label for="cs${i}">${k}</label><input type="range" id="cs${i}" min="30" max="99" value="${c.st[i]}"><output id="co${i}">${c.st[i]}</output></div>`).join('')}
  <p class="ex">RIT ritmo, CHU chute, PAS passe, DRI drible, DEF defesa, FIS físico. O professor avalia a cada trimestre e o overall muda conforme a posição.</p>
  <div class="field"><label for="cardPhoto">Foto do aluno</label><input type="file" id="cardPhoto" accept="image/*"></div>
  <p class="ex">A foto é lida só no seu navegador e não é enviada a lugar nenhum. Alunos sem foto mostram uma silhueta.</p></div>
 <div class="card"><h2>Carta de ${a.name.split(' ')[0]}</h2><div class="fcwrap" id="cardBox">${cardHTML(a)}</div>
  <p class="muted" style="text-align:center;margin:8px 0 0">${t.name} · ${t.dias} ${t.hora} · ${t.coach}</p></div></div>
 <div class="card"><h2>Ranking de overall</h2><div class="scroll"><table><thead><tr><th>#</th><th>Aluno</th><th>Turma</th><th>Pos.</th><th>Overall</th></tr></thead><tbody>
 ${top.map((x,i)=>`<tr class="rk" data-pick="${x.id}"><td>${i+1}</td><td><b>${x.name}</b></td><td>${TURMAS.find(y=>y.id===x.turma).name} · ${uname(x.unit)}</td><td>${cardOf(x).pos}</td><td><span class="pill ok">${ovrOf(cardOf(x))}</span></td></tr>`).join('')}</tbody></table></div>
 <p class="ex">Clique em um aluno para abrir a carta. Notas fictícias.</p></div>`}
VIEWS.carta=vCarta;TABS.splice(5,0,['carta','Carta do aluno']);
document.addEventListener('click',e=>{const b=e.target.closest('[data-pick]');if(b){state.card=b.dataset.pick;render();window.scrollTo(0,0)}});
document.addEventListener('input',e=>{const m=/^cs(\d)$/.exec(e.target.id);if(!m)return;const a=ALUNOS.find(x=>x.id===state.card),c=cardOf(a);c.st[+m[1]]=+e.target.value;$('#co'+m[1]).textContent=e.target.value;$('#cardBox').innerHTML=cardHTML(a)});
document.addEventListener('change',e=>{const id=e.target.id;
 if(id==='cardSel'){state.card=e.target.value;render()}
 else if(id==='cardPos'){cardOf(ALUNOS.find(x=>x.id===state.card)).pos=e.target.value;render()}
 else if(id==='cardPhoto'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{PH[state.card]=r.result;render()};r.readAsDataURL(e.target.files[0])}});
render();
</script>
