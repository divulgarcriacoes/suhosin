<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo das Matriarcas - Coleta de Prendas</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        #game {
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            z-index: 100;
            max-width: 250px;
        }
        .score {
            margin-bottom: 8px;
            font-weight: bold;
            color: #FFD700;
        }
        .missoes {
            margin-top: 15px;
            border-top: 1px solid #666;
            padding-top: 10px;
            font-size: 14px;
        }
        .missao-item {
            margin-bottom: 8px;
            padding: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }
        .missao-completa {
            color: #90EE90;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
        }
        #missoes-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
            max-width: 300px;
            max-height: 400px;
            overflow-y: auto;
        }
        .missao-titulo {
            font-weight: bold;
            margin-bottom: 15px;
            color: #FFD700;
            font-size: 16px;
        }
        .missao {
            margin-bottom: 12px;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            border-left: 3px solid #FFD700;
        }
        .missao-completa {
            background: rgba(144,238,144,0.2);
            border-left-color: #90EE90;
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <div id="info">
        <div class="score">⭐ Pontos: <span id="score">0</span></div>
        <div>📦 Itens: <span id="prendas">0</span></div>
        <div class="missoes">
            <div style="font-weight: bold; margin-bottom: 8px;">🎯 Missões Ativas:</div>
            <div id="missoes-ativas"></div>
        </div>
    </div>
    <div id="missoes-panel">
        <div class="missao-titulo">📋 MISSÕES DISPONÍVEIS</div>
        <div id="missoes-lista"></div>
    </div>
    <div class="controls">
        <div>⬆️ Setas para mover</div>
        <div>📱 Ou clique na tela</div>
        <div style="margin-top: 8px; color: #FFD700;">M = Abrir Missões</div>
    </div>

    <script>
        const config = {
            type: Phaser.AUTO,
            width: 1024,
            height: 768,
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 0 },
                    debug: false
                }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);

        function preload() {
            // Nada para pré-carregar agora
        }

        function create() {
            // Criar fundo (mapa da comunidade)
            const graphics = this.make.graphics({ x: 0, y: 0, add: false });
            graphics.fillStyle(0x90EE90, 1);
            graphics.fillRect(0, 0, 1024, 768);
            graphics.generateTexture('background', 1024, 768);
            graphics.destroy();

            this.add.image(512, 384, 'background');

            // Desenhar Rua Santa Júlia
            const rua = this.add.graphics();
            rua.fillStyle(0x888888, 1);
            rua.fillRect(0, 350, 1024, 80); // Rua Santa Júlia

            // Nome da rua
            this.add.text(20, 360, 'RUA SANTA JÚLIA', {
                fontSize: '16px',
                fill: '#FFFF00',
                fontStyle: 'bold'
            }).setDepth(1);
            rua.destroy();

            // Adicionar casas da Rua Santa Júlia
            const casas = [
                { x: 150, y: 250, cor: 0xFF1493, prendas: 'Agasalhos', numero: '12' },
                { x: 300, y: 250, cor: 0x1E90FF, prendas: 'Alimentos', numero: '20' },
                { x: 450, y: 250, cor: 0xFFD700, prendas: 'Dinheiro', numero: '28' },
                { x: 600, y: 250, cor: 0x32CD32, prendas: 'Roupas', numero: '32' },
                { x: 750, y: 250, cor: 0xFF6347, prendas: 'Brinquedos', numero: '40' },

                { x: 150, y: 500, cor: 0x8B4513, prendas: 'Utensílios', numero: '15' },
                { x: 300, y: 500, cor: 0x9370DB, prendas: 'Livros', numero: '23' },
                { x: 450, y: 500, cor: 0xFF00FF, prendas: 'Doações', numero: '36' },
                { x: 600, y: 500, cor: 0xFF69B4, prendas: 'Alimentos', numero: '38' },
                { x: 750, y: 500, cor: 0xDAAA00, prendas: 'Móveis', numero: '46' }
            ];

            this.casas = this.physics.add.staticGroup();

            casas.forEach((casa, index) => {
                const rect = this.add.rectangle(casa.x, casa.y, 120, 80, casa.cor);
                rect.setDepth(0);

                // Destacar a casa do usuário (nº 36)
                if (casa.numero === '36') {
                    const border = this.add.rectangle(casa.x, casa.y, 135, 95);
                    border.setStrokeStyle(5, 0xFFFF00);
                    border.setFillStyle(null);
                    border.setDepth(-1);

                    const estrela = this.add.text(casa.x, casa.y - 45, '⭐ SUA CASA ⭐', {
                        fontSize: '13px',
                        fill: '#FFD700',
                        fontStyle: 'bold',
                        backgroundColor: '#000000',
                        padding: { x: 6, y: 3 }
                    });
                    estrela.setOrigin(0.5);
                    estrela.setDepth(2);
                }

                this.casas.add(rect);

                // Adicionar número da casa
                const numero = this.add.text(casa.x, casa.y - 22, `Nº ${casa.numero}`, {
                    fontSize: '13px',
                    fill: '#FFFFFF',
                    fontStyle: 'bold',
                    backgroundColor: '#000000',
                    padding: { x: 5, y: 2 }
                });
                numero.setOrigin(0.5);
                numero.setDepth(2);

                // Adicionar texto com nome da prendas
                const text = this.add.text(casa.x, casa.y + 5, casa.prendas, {
                    fontSize: '12px',
                    fill: '#FFFFFF',
                    fontStyle: 'bold',
                    align: 'center'
                });
                text.setOrigin(0.5, 0.5);
                text.setDepth(1);

                // Guardar info da casa
                rect.prendas = casa.prendas;
                rect.numero = casa.numero;
                rect.coletado = false;
                rect.index = index;
            });

            // Criar personagem (matriarca)
            this.personagem = this.add.circle(512, 400, 20, 0xFF1493);
            this.personagem.setDepth(2);
            this.physics.add.existing(this.personagem);
            this.personagem.body.setCollideWorldBounds(true);
            this.personagem.body.setBounce(0.2);

            // Adicionar olhos ao personagem
            this.add.circle(508, 396, 4, 0xFFFFFF).setDepth(3);
            this.add.circle(516, 396, 4, 0xFFFFFF).setDepth(3);

            // Variáveis de controle
            this.score = 0;
            this.prendas = 0;
            this.coletadas = [];

            // Detector de clique
            this.input.on('pointerdown', (pointer) => {
                const distance = Phaser.Math.Distance.Between(
                    this.personagem.x, this.personagem.y,
                    pointer.x, pointer.y
                );

                if (distance > 0) {
                    const angle = Phaser.Math.Angle.Between(
                        this.personagem.x, this.personagem.y,
                        pointer.x, pointer.y
                    );
                    this.personagem.body.setVelocity(
                        Math.cos(angle) * 200,
                        Math.sin(angle) * 200
                    );
                }
            });

            // Colisão com casas
            this.physics.add.overlap(this.personagem, this.casas, (player, casa) => {
                if (!casa.coletado) {
                    casa.coletado = true;
                    this.score += 100;
                    this.prendas += 1;
                    this.coletadas.push(casa.prendas);

                    // Feedback visual
                    casa.setFillStyle(0x000000, 0.5);

                    // Criar partículas de celebração
                    const particles = this.add.particles(0xFFFF00);
                    const emitter = particles.createEmitter({
                        speed: { min: -100, max: 100 },
                        angle: { min: 240, max: 300 },
                        scale: { start: 1, end: 0 },
                        lifespan: 600,
                        gravityY: 200
                    });
                    emitter.explode(8, casa.x, casa.y);

                    // Som de sucesso (usando oscilador de áudio)
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.frequency.value = 800;
                    gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                    osc.start(audioContext.currentTime);
                    osc.stop(audioContext.currentTime + 0.1);

                    this.updateUI();

                    // Verificar vitória
                    if (this.prendas === 6) {
                        this.showVictory();
                    }
                }
            });

            this.cameras.main.setBounds(0, 0, 1024, 768);
            this.physics.world.setBounds(0, 0, 1024, 768);
        }

        function update() {
            const cursors = this.input.keyboard.createCursorKeys();
            const speed = 200;

            if (cursors.left.isDown) {
                this.personagem.body.setVelocityX(-speed);
            } else if (cursors.right.isDown) {
                this.personagem.body.setVelocityX(speed);
            } else {
                this.personagem.body.setVelocityX(0);
            }

            if (cursors.up.isDown) {
                this.personagem.body.setVelocityY(-speed);
            } else if (cursors.down.isDown) {
                this.personagem.body.setVelocityY(speed);
            } else {
                this.personagem.body.setVelocityY(0);
            }
        }

        function updateUI() {
            document.getElementById('score').textContent = this.score;
            document.getElementById('prendas').textContent = this.prendas;
        }

        function showVictory() {
            const text = this.add.text(512, 300, '🎉 PARABÉNS! 🎉\nTodas as prendas coletadas!', {
                fontSize: '32px',
                fill: '#FFD700',
                align: 'center',
                backgroundColor: '#000000',
                padding: { x: 20, y: 20 },
                borderRadius: 10
            });
            text.setOrigin(0.5);
            text.setDepth(100);

            const pontos = this.add.text(512, 400, `Pontuação Final: ${this.score}`, {
                fontSize: '24px',
                fill: '#FFFFFF',
                align: 'center'
            });
            pontos.setOrigin(0.5);
            pontos.setDepth(100);

            const restart = this.add.text(512, 500, 'Pressione ESPAÇO para jogar novamente', {
                fontSize: '16px',
                fill: '#FFFF00',
                align: 'center'
            });
            restart.setOrigin(0.5);
            restart.setDepth(100);

            this.input.keyboard.on('keydown-SPACE', () => {
                this.scene.restart();
            });
        }
    </script>
</body>
</html>
